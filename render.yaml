services:
  - type: web
    runtime: docker
    name: AlphaClaw
    plan: pro plus
    healthCheckPath: /health
    dockerCommand: /bin/bash /data/.gbrain/render-start.sh
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PORT
        value: 3000
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10
