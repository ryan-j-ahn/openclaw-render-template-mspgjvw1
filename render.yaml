services:
  - type: web
    runtime: docker
    name: AlphaClaw
    plan: pro plus
    healthCheckPath: /health
    dockerCommand: /bin/bash /data/.gbrain/render-start.sh
    autoDeployTrigger: off
    envVars:
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PORT
        value: 3000
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10

  - type: web
    runtime: docker
    name: gbrain-edge
    plan: starter
    region: oregon
    rootDir: infra/gbrain-edge
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: GBRAIN_HOST
        fromService:
          type: web
          name: AlphaClaw
          property: host
